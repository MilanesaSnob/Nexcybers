<section class="section-pad about-hero" style="overflow:hidden">

            <defs>
              <radialGradient id="atomCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="var(--gold)" stop-opacity="1"/>
                <stop offset="60%" stop-color="var(--gold)" stop-opacity="0.85"/>

              <path id="atomOrbitPath" d="M100,14 A36,86 0 1,1 100,186 A36,86 0 1,1 100,14"/>

            <circle class="atom-field" cx="100" cy="100" r="92"/>
            <circle class="atom-ring dashed" cx="100" cy="100" r="92"/>
            <circle class="atom-ring dashed" cx="100" cy="100" r="58"/>
            <g class="atom-spin">
              <g class="orb orb1">
                <path class="atom-orbit" d="M100,14 A36,86 0 1,1 100,186 A36,86 0 1,1 100,14"/>
                <circle class="atom-electron" r="4.5">
                  <animateMotion dur="3.4s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath href="#atomOrbitPath"/></animateMotion>
                </circle>
              </g>
              <g class="orb orb2">
                <path class="atom-orbit" d="M100,14 A36,86 0 1,1 100,186 A36,86 0 1,1 100,14"/>
                <circle class="atom-electron" r="4.5">
                  <animateMotion dur="4.6s" begin="-1.2s" repeatCount="indefinite" rotate="auto"><mpath href="#atomOrbitPath"/></animateMotion>
                </circle>
              </g>
              <g class="orb orb3">
                <path class="atom-orbit" d="M100,14 A36,86 0 1,1 100,186 A36,86 0 1,1 100,14"/>
                <circle class="atom-electron" r="4.5">
                  <animateMotion dur="5.8s" begin="-2.4s" repeatCount="indefinite" rotate="auto"><mpath href="#atomOrbitPath"/></animateMotion>
                </circle>
              </g>
            </g>
            <circle class="atom-halo" cx="100" cy="100" r="22"/>
            <circle class="atom-nucleus" cx="100" cy="100" r="13"/>
            <circle class="atom-nucleus-core" cx="100" cy="100" r="5"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
