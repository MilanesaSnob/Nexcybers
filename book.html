      <form class="contact-form" id="book-form" data-reveal>
        <div class="field">
          <label for="b-name"><span id="label-name">Full name</span><span class="req">*</span></label>
          <input id="b-name" name="name" type="text" required>
        </div>
        <div class="field">
          <label for="b-email"><span id="label-email">Email</span><span class="req">*</span></label>
          <input id="b-email" name="email" type="email" required>
        </div>
        <div class="field">
          <label for="b-phone"><span id="label-phone">Phone</span><span class="req">*</span></label>
          <input id="b-phone" name="phone" type="tel" required>
        </div>
        <div class="field">
          <label for="b-message"><span id="label-message">Message</span><span class="req">*</span></label>
          <textarea id="b-message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="form-submit">Send message</button>
      </form>

      <div class="contact-side">
        <div class="contact-info-card" data-reveal>
          <p class="book-intro" data-i="book_intro"></p>
          <p class="field-hint" data-i="book_form_hint"></p>
          <p class="form-privacy" data-i="book_privacy"></p>
